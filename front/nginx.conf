server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;

        # Forward the visitor's real IP (used by the backend's per-IP rate limit) and the original
        # host/scheme. They come from the HTTPS reverse proxy of the VPS, which must set
        # X-Forwarded-For / X-Forwarded-Proto / Host (see README, "Production: reverse proxy").
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Swagger UI and its OpenAPI description (public showcase of the API)
    location ~ ^/(swagger-ui|v3/api-docs)(/|\.html$|$) {
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /ws/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
