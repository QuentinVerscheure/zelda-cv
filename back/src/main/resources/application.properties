# Spring
spring.application.name=Zelda-cv
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=off

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/zeldacv
spring.datasource.username=root
spring.datasource.password=pass

# JWT secret
jwt.secret=monSuperCodeIncrackablePlusLongCarApparementLeSecretPrecedentEtaitTropCourt
app.jwt-expiration-milliseconds=3600000 

# Mail configuration - credentials come from MAIL_USER/MAIL_PASS env vars,
# never hardcode real secrets here since this file is committed to git.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORES configuration
app.cors.allowed-origin=*