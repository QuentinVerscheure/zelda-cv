# Spring
spring.application.name=Zelda-cv
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=off

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3307/zeldacv
spring.datasource.username=root
spring.datasource.password=pass

# Database migrations (Flyway), applied automatically at startup.
# baseline-on-migrate lets Flyway adopt a database created before Flyway was introduced:
# with baseline-version=0, migration V1 still runs on it (and cleans the old account-based tables).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Mail configuration - credentials come from MAIL_USER/MAIL_PASS env vars,
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORES configuration
app.cors.allowed-origin=*

# Reverse proxy: read the real visitor IP from X-Forwarded-For (needed for the per-IP rate limit).
# Only private/loopback addresses (the nginx proxies) are trusted to set this header.
server.forward-headers-strategy=native

# Per-IP rate limits (requests per hour)
app.rate-limit.comment-create-per-hour=5
app.rate-limit.comment-edit-per-hour=120
app.rate-limit.mail-per-hour=3

# Actuator
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false
