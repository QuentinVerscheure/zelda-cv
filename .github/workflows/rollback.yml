name: Rollback Zelda CV

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "SHA Git à redéployer"
        required: true
        type: string

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  rollback-production:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Rollback production
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/zelda-cv &&
             IMAGE_TAG=${{ inputs.image_tag }} docker compose -f compose.yaml -f compose.prod.yaml pull &&
             IMAGE_TAG=${{ inputs.image_tag }} docker compose -f compose.yaml -f compose.prod.yaml up -d &&
             IMAGE_TAG=${{ inputs.image_tag }} docker compose -f compose.yaml -f compose.prod.yaml ps"