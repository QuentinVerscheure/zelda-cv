name: CI Zelda CV

# On master, this workflow is run by deploy.yml (workflow_call) before building the production
# images: a failing test blocks the deployment. It also runs on pull requests and manually.
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        working-directory: back
        run: chmod +x mvnw

      # Unit + integration tests; the integration tests start a throwaway MySQL with Testcontainers
      # (Docker is available on GitHub-hosted runners).
      - name: Test and build backend
        working-directory: back
        run: ./mvnw clean verify

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Test frontend
        working-directory: front
        run: npm test -- --watch=false

      - name: Build frontend
        working-directory: front
        run: npm run build

  test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build backend Docker image
        run: docker build -t zelda-cv-backend:test ./back

      - name: Build frontend Docker image
        run: docker build -t zelda-cv-frontend:test ./front